<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">


    <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>

  <script src="https://cdn.tailwindcss.com">
  </script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <style>
   body {
            font-family: 'Roboto', sans-serif;
        }

  </style>
 </head>

    <title>{% block title %}{% endblock %}</title>
</head>
<body>
<div class="page">
    <header class="bg-gray-800 text-white p-6 shadow-lg">
   <div class="container mx-auto flex justify-between items-center">
    <div class="flex items-center space-x-4">
     <h1 class="text-3xl font-bold flex items-center">
      <i class="fas fa-book-open mr-2 text-yellow-500"></i>Library
     </h1>
     <div class="relative">
      <input class="bg-gray-700 text-white rounded-full pl-10 pr-4 py-2 focus:outline-none" placeholder="Search..." type="text"/>
      <i class="fas fa-search absolute left-3 top-2.5 text-gray-400"></i>
     </div>
    </div>
    <nav class="flex items-center space-x-6 text-lg">
     <ul class="flex space-x-6">
      <li>
       <a class="hover:text-yellow-500 transition duration-300" href="/">
        Home
       </a>
      </li>
      <li>
       <a class="hover:text-yellow-500 transition duration-300" href="#">
        Books
       </a>
      </li>
      <li>
       <a class="hover:text-yellow-500 transition duration-300" href="{{url_for('about')}}">
        About
       </a>
      </li>
      <li>
       <a class="hover:text-yellow-500 transition duration-300" href="#">
        Contact
       </a>
      </li>
     </ul>
     <div class="flex items-center space-x-4">
      <i class="fas fa-user-circle text-2xl"></i>
      <button class="bg-yellow-500 text-gray-800 px-4 py-2 rounded-full hover:bg-yellow-600 transition duration-300">
       Login
      </button>
     </div>
    </nav>
   </div>
  </header>
    <div class="content">
        {% block content %}{% endblock %}
    </div>

    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
    <div class="col-md-4 d-flex align-items-center">
      <a href="/" class="mb-3 me-2 mb-md-0 text-body-secondary text-decoration-none lh-1">
        <img class="header__img" src="{{url_for('static',filename='img/ic_tree.png')}}" alt="cristmas tree as icon">
      </a>
      <span class="mb-3 mb-md-0 text-body-secondary">© 2024 olapis created</span>
    </div>

    <ul class="nav col-md-4 justify-content-end list-unstyled d-flex">
        <img class="header__img" src="{{url_for('static',filename='img/ic_tree.png')}}" alt="cristmas tree as icon">
      <img class="header__img" src="{{url_for('static',filename='img/ic_tree.png')}}" alt="cristmas tree as icon">
      <img class="header__img" src="{{url_for('static',filename='img/ic_tree.png')}}" alt="cristmas tree as icon">
    </ul>
  </footer>

</div>



<script>
   const prevRecommendedButton = document.getElementById('prev-recommended');
        const nextRecommendedButton = document.getElementById('next-recommended');
        const recommendedContainer = document.querySelector('.carousel-container');

        prevRecommendedButton.addEventListener('click', () => {
            recommendedContainer.scrollBy({
                left: -800,
                behavior: 'smooth'
            });
        });

        nextRecommendedButton.addEventListener('click', () => {
            recommendedContainer.scrollBy({
                left: 800,
                behavior: 'smooth'
            });
        });

        const prevPopularButton = document.getElementById('prev-popular');
        const nextPopularButton = document.getElementById('next-popular');
        const popularContainer = document.querySelector('.carousel-container');

        prevPopularButton.addEventListener('click', () => {
            popularContainer.scrollBy({
                left: -800,
                behavior: 'smooth'
            });
        });

        nextPopularButton.addEventListener('click', () => {
            popularContainer.scrollBy({
                left: 800,
                behavior: 'smooth'
            });
        });

        const prevReadersChoiceButton = document.getElementById('prev-readers-choice');
        const nextReadersChoiceButton = document.getElementById('next-readers-choice');
        const readersChoiceContainer = document.querySelector('.carousel-container');

        prevReadersChoiceButton.addEventListener('click', () => {
            readersChoiceContainer.scrollBy({
                left: -800,
                behavior: 'smooth'
            });
        });

        nextReadersChoiceButton.addEventListener('click', () => {
            readersChoiceContainer.scrollBy({
                left: 800,
                behavior: 'smooth'
            });
        });
  </script>
</body>
</html>



</body>
</html>
